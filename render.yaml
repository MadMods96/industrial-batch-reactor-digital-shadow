# Render Blueprint — live digital shadow API (no AI)

services:
  - type: web
    name: htpp-digital-shadow-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -e ./backend
    startCommand: python scripts/render_start.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HOST
        value: "0.0.0.0"
      # Live panel pulls every HTPP_INCREMENTAL_CRON_MINUTES
      - key: HTPP_DISABLE_SCHEDULER
        value: "0"
      - key: HTPP_DB_PATH
        value: data/htpp.duckdb
      - key: HTPP_ARTIFACT_DIR
        value: backend/artifacts
      - key: HTPP_PLANT_LABEL
        value: Plant Floor
      - key: HTPP_API_CORS_ORIGINS
        sync: false
      - key: HTPP_PANEL_BASE_URL
        sync: false
      - key: HTPP_PANEL_USERNAME
        sync: false
      - key: HTPP_PANEL_PASSWORD
        sync: false
      - key: HTPP_MACHINE_IDS
        value: "1093,1094,1146"
      - key: HTPP_MACHINE_LABELS
        value: "1093:R1 Unit 1,1094:R2 Unit 2,1146:R3 Unit 3"
