[project]
name = "htpp"
version = "0.1.0"
description = "HTPP reactor digital shadow: ingestion, reduced-order models, API"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "apscheduler>=3.10",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "python-multipart>=0.0.12",
  "pytz>=2024.1",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htpp"]

[tool.hatch.build.targets.wheel.sources]
"src/htpp" = "htpp"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
